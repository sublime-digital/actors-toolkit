<div class="container">
    <div class="row">
      <div class="col-md-1">
      </div>

      <div class="col-md-8">

      <h3 class="text">Rate your:</h3>

      <div class="d-flex align-items-center gap-3 my-3">
        <!-- Toggles Good Feelings section -->
        <button
          type="button"
          class="btn btn-action-primary px-4 py-2 fw-bold"
          (click)="goodmoods = !goodmoods">
          Good Feelings
        </button>

        <!-- Triggers Pro Auth Modal for Bad Feelings -->
        <button
          type="button"
          class="btn btn-action-secondary px-4 py-2 fw-bold"
          (click)="proTools()">
          Bad Feelings
        </button>
      </div>

      <!-- Good Feelings Animated Section -->
      @if (goodmoods) {
        <div class="goodmoods-container slide-down-animated">
          <div class="row goodmoods">
            <div class="col-md-2">
              <p><label for="range-spectacular" class="form-label">Spectacular</label>
              <br><input type="range" class="form-range" id="range-spectacular" (mouseup)="playSound()"></p>
              <p><label for="range-hopeful" class="form-label">Hopeful</label>
              <br><input type="range" class="form-range" id="range-hopeful" (mouseup)="playSound()"></p>
              <p><label for="range-kind" class="form-label">Kind</label>
              <br><input type="range" class="form-range" id="range-kind" (mouseup)="playSound()"></p>
              <p><label for="range-focused" class="form-label">Focused</label>
              <br><input type="range" class="form-range" id="range-focused" (mouseup)="playSound()"></p>
              <p><label for="range-powerful" class="form-label">Powerful</label>
              <br><input type="range" class="form-range" id="range-powerful" (mouseup)="playSound()"></p>
              <p><label for="range-strong" class="form-label">Strong</label>
              <br><input type="range" class="form-range" id="range-strong" (mouseup)="playSound()"></p>
            </div>

            <div class="col-md-2">
              <p><label for="range-supportive" class="form-label">Supportive</label>
              <br><input type="range" class="form-range" id="range-supportive" (mouseup)="playSound()"></p>
              <p><label for="range-creative" class="form-label">Creative</label>
              <br><input type="range" class="form-range" id="range-creative" (mouseup)="playSound()"></p>
              <p><label for="range-nonchalant" class="form-label">Nonchalant</label>
              <br><input type="range" class="form-range" id="range-nonchalant" (mouseup)="playSound()"></p>
              <p><label for="range-open" class="form-label">Open</label>
              <br><input type="range" class="form-range" id="range-open" (mouseup)="playSound()"></p>
              <p><label for="range-relaxed" class="form-label">Relaxed</label>
              <br><input type="range" class="form-range" id="range-relaxed" (mouseup)="playSound()"></p>
              <p><label for="range-smooth" class="form-label">Smooth</label>
              <br><input type="range" class="form-range" id="range-smooth" (mouseup)="playSound()"></p>
            </div>

            <div class="col-md-2"></div>
            <div class="col-md-2"></div>
            <div class="col-md-2"></div>

            <div class="col-md-2 align-self-end">
              <button type="button" class="btn btn-action-primary py-2 px-4 fw-bold" (click)="playSound()">
                Submit
              </button>
            </div>
          </div>
        </div>
      } @else {
        <!-- Pro Member Fallback Card -->
        <div class="pro-notice-container slide-down-animated p-4 rounded-3 text-center my-3">
          <h4 class="h5 text-info mb-0">Advanced features are available for Pro members only</h4>
        </div>
      }

  <div class="header-container svg-container">
  <img src="assets/teatro2.svg" alt="Icon" class="transparent-svg bounce-in-svg">
  </div>

      </div>

            <div class="col-md-3">
                        <div class="card advert">
            <div class="card-header">
              <h6 class="h6">Advertisement</h6>
            </div>
            <div>
              <a [href]="currentLink()">
                <div class="image-frame">
                  <img [src]="currentImage()" alt="Adverts" class="fade-in">
                </div>
              </a>
          </div>
          </div>
      </div>

</div>
