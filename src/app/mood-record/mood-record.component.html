<div class="container">
    <div class="row">
      <div class="col-md-1">
      </div>

      <div class="col-md-8">

      <h3 class="text">Rate your:</h3>

      <div class="d-flex align-items-center gap-3 my-3">
        <!-- Toggles Good Feelings section -->
        <button
          type="button"
          class="btn btn-action-primary px-4 py-2 fw-bold"
          (click)="goodmoods = !goodmoods">
          Good Feelings
        </button>

        <!-- Triggers Pro Auth Modal for Bad Feelings -->
        <button
          type="button"
          class="btn btn-action-secondary px-4 py-2 fw-bold"
          (click)="proTools()">
          Bad Feelings
        </button>
      </div>
