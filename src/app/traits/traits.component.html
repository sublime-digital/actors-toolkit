<div class="container">
    <div class="row">
      <div class="col-md-1">
      </div>

      <div class="col-md-8">

  <h3 class="text">Rate yourself on:</h3>&nbsp;
<div class="d-flex align-items-center gap-3 my-3">
  <!-- Toggles Strengths section -->
  <button
    type="button"
    class="btn btn-action-primary px-4 py-2 fw-bold"
    (click)="goodmoods = !goodmoods">
    Character Strengths
  </button>

  <!-- Triggers Pro Auth Modal for Flaws -->
  <button
    type="button"
    class="btn btn-action-secondary px-4 py-2 fw-bold"
    (click)="proTools()">
    Character Flaws
  </button>
</div>

<!-- Strengths Section with Toggle Slide Animation -->
@if (goodmoods) {
  <div class="goodmoods-container slide-down-animated">
    <div class="row goodmoods">
      <div class="col-md-2">
        <p><label for="range-opt" class="form-label">Optimistic</label>
        <br><input type="range" class="form-range" id="range-opt" (mouseup)="playSound()"></p>
        <p><label for="range-fair" class="form-label">Fair</label>
        <br><input type="range" class="form-range" id="range-fair" (mouseup)="playSound()"></p>
        <p><label for="range-giving" class="form-label">Giving</label>
        <br><input type="range" class="form-range" id="range-giving" (mouseup)="playSound()"></p>
        <p><label for="range-energy" class="form-label">Energetic</label>
        <br><input type="range" class="form-range" id="range-energy" (mouseup)="playSound()"></p>
        <p><label for="range-like" class="form-label">Likeable</label>
        <br><input type="range" class="form-range" id="range-like" (mouseup)="playSound()"></p>
        <p><label for="range-cheer" class="form-label">Cheerful</label>
        <br><input type="range" class="form-range" id="range-cheer" (mouseup)="playSound()"></p>
      </div>

      <div class="col-md-2">
        <p><label for="range-love" class="form-label">Easy to Love</label>
        <br><input type="range" class="form-range" id="range-love" (mouseup)="playSound()"></p>
        <p><label for="range-flex" class="form-label">Flexible</label>
        <br><input type="range" class="form-range" id="range-flex" (mouseup)="playSound()"></p>
        <p><label for="range-understand" class="form-label">Understanding</label>
        <br><input type="range" class="form-range" id="range-understand" (mouseup)="playSound()"></p>
        <p><label for="range-express" class="form-label">Expressive</label>
        <br><input type="range" class="form-range" id="range-express" (mouseup)="playSound()"></p>
        <p><label for="range-interest" class="form-label">Interesting</label>
        <br><input type="range" class="form-range" id="range-interest" (mouseup)="playSound()"></p>
        <p><label for="range-passion" class="form-label">Passionate</label>
        <br><input type="range" class="form-range" id="range-passion" (mouseup)="playSound()"></p>
      </div>

      <div class="col-md-2"></div>
      <div class="col-md-2"></div>
      <div class="col-md-2"></div>

      <div class="col-md-2 align-self-end">
        <button class="btn btn-action-primary py-2 px-4" (click)="playSound()">Submit</button>
      </div>
    </div>
  </div>
} @else {
  <!-- Pro Fallback Block -->
  <div class="pro-notice-container slide-down-animated p-4 rounded-3 text-center my-3">
    <h4 class="h5 text-info mb-0">Advanced features are available for Pro members only</h4>
  </div>
}

<div class="header-container svg-container">
  <img src="assets/teatro2.svg" alt="Icon" class="transparent-svg bounce-in-svg">
</div>

</div>
      <div class="col-md-3">
          <div class="card advert">
            <div class="card-header">
              <h6 class="h6">Advertisement</h6>
            </div>
            <div>
              <a [href]="currentLink()">
                <div class="image-frame">
                  <img [src]="currentImage()" alt="Adverts" class="fade-in">
                </div>
              </a>
          </div>
          </div>
      </div>
    </div>
    </div>
